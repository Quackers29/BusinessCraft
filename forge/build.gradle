// Forge platform module - Minimal Forge-specific implementations
// Depends on common module for all business logic

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

archivesBaseName = 'businesscraft-forge'

minecraft {
    mappings channel: 'parchment', version: '2023.06.26-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                businesscraft {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                businesscraft {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'

    // Include common module source directly
    compileOnly project(':common')

    // JetBrains annotations for @NotNull/@Nullable
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

// Include common module source directly
sourceSets.main.java.srcDirs += project(':common').sourceSets.main.java.srcDirs
sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs

jar {
    manifest {
        attributes([
            "Specification-Title": "businesscraft-forge",
            "Specification-Vendor": "Quackers29",
            "Specification-Version": "1",
            "Implementation-Title": "BusinessCraft Forge",
            "Implementation-Version": project.version,
            "Implementation-Vendor": "Quackers29",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Common resources are merged via sourceSets; keep first on path if any clash
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Dev-only client flags. -PquickPlay=<save> jumps into that world.
// -Pshowcase=<scenes> sets businesscraft.showcase for the screenshot harness.
// Template world copy for tools/showcase.sh: SHOWCASE_TEMPLATE, showcaseTemplate
// in gradle.properties, or -PshowcaseTemplate=...
// ForgeGradle registers runClient during its own afterEvaluate, so this has to
// configure the task when it appears. Args live on the task so a quick-play
// world is already present before launch, instead of the default save.
tasks.configureEach { task ->
    if (task.name != 'runClient') {
        return
    }
    def quickPlayWorld = project.findProperty('quickPlay')
    if (quickPlayWorld != null && !quickPlayWorld.toString().trim().isEmpty()) {
        task.args '--quickPlaySingleplayer', quickPlayWorld.toString()
    }
    def showcaseScenes = project.findProperty('showcase')
    if (showcaseScenes != null) {
        task.systemProperty 'businesscraft.showcase', showcaseScenes.toString()
        def showcaseLoader = project.findProperty('showcaseLoader')
        if (showcaseLoader != null) {
            task.systemProperty 'businesscraft.showcase.loader', showcaseLoader.toString()
        }
        def showcaseWidth = project.findProperty('showcaseWidth')
        def showcaseHeight = project.findProperty('showcaseHeight')
        if (showcaseWidth != null && showcaseHeight != null) {
            task.args '--width', showcaseWidth.toString(), '--height', showcaseHeight.toString()
        }
        def testbedChecks = project.findProperty('testbedChecks')
        if (testbedChecks != null) {
            task.systemProperty 'businesscraft.showcase.testbed.checks', testbedChecks.toString()
        }
        def showcaseMapTag = project.findProperty('showcaseMapTag')
        if (showcaseMapTag != null) {
            task.systemProperty 'businesscraft.showcase.mapTag', showcaseMapTag.toString()
        }
    }
}

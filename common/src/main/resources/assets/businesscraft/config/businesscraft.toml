# BusinessCraft Configuration
# This file controls all mod settings. Edit values below to customize behavior.
# Changes are automatically detected and reloaded.

[general]
    # Default starting population for new towns
    # (Town spacing uses each town's boundary radius, not a flat min-distance setting.)
    defaultStartingPopulation = 5
    # Default town boundary radius (blocks) when no border modifier is set.
    # New-town placement requires defaultBorderRadius + existing town's border.
    defaultBorderRadius = 50
    # When false: Town Interface block is nearly indestructible in survival.
    # Creative players can still place and break it.
    # When true (default): Block is craftable and can be mined with a diamond pickaxe or better (obsidian difficulty).
    craftableTownInterface = true
    # List of random town names for auto-naming
    townNames = ["Riverside", "Hillcrest", "Meadowbrook", "Oakville", "Stonebridge", "Willowglen", "Sunnyvale", "Cedarwood", "Maplehaven", "Brookside", "Fairview", "Pinehurst", "Elmwood", "Greystone"]

[platforms]
    # Highest search radius a platform may use, in blocks.
    # Each platform still starts at 10, with spread 0 (tourists stand on the path line).
    # Spread cannot exceed that platform's own search radius, so this is also the spread cap.
    maxSearchRadius = 100

[vehicles]
    # Enable Create mod train integration
    enableCreateTrains = true
    # Enable minecart detection for tourists
    enableMinecarts = true
    # Search radius for vehicle detection (blocks)
    vehicleSearchRadius = 3
    # Minecart stop velocity threshold
    minecartStopThreshold = 0.001

[tourists]
    enabled = true
    # Master switch - completely disables tourist spawning globally
    # Minimum population required to spawn tourists
    minPopForTourists = 5
    # Maximum tourists per town
    maxTouristsPerTown = 1000
    # Population required per tourist slot
    populationPerTourist = 5
    # Maximum population-based tourists
    maxPopBasedTourists = 20
    # Tourist expiry time in minutes (0 = never expire)
    touristExpiryMinutes = 120.0
    # Enable tourist expiry system
    enableTouristExpiry = true
    # Notify origin town when tourist departs
    notifyOnTouristDeparture = true
    # Blocks traveled to reach tourist ranks 2, 3, 4, 5 (rank 1 is below the first number).
    # With metersPerEmerald = 100 that is about 5 / 15 / 30 / 60 emeralds per tourist.
    levelDistances = [500, 1500, 3000, 6000]
    # Default destination mode for newly placed platforms: any, auto, or specific
    defaultDestinationMode = "auto"
    # AUTO: max fraction of spawns using learned destinations once confidence is full (0.0–1.0)
    autoMaxLearnedShare = 0.7
    # AUTO: half-life for learned route scores, in in-game minutes
    autoScoreHalfLifeMinutes = 10080.0
    # AUTO: learned scores below this are removed
    autoPruneFloor = 0.05
    # AUTO: maximum learned destination towns kept per platform
    autoMaxLearnedTowns = 12
    # AUTO: total learned score before learned routes affect spawns
    autoMinScoreForLearning = 2.0
    # AUTO: score penalty when a learned-destination tourist expires without arriving
    autoExpiryPenalty = 1.0
    # AUTO: per-route fade half-life is at least (average trip ticks × this multiplier)
    autoFadeTripMultiplier = 2.0

[economy]
    # Blocks traveled per emerald per tourist (linear curve when payoutCurveExponent = 1.0).
    # Default 100 → 1 km ≈ 10 emeralds/tourist; 300/500/1000/1500 blocks → 3/5/10/15.
    metersPerEmerald = 100
    # Minimum average travel distance (blocks) before an arrival batch earns any payment
    # Prevents farming the 1-emerald minimum with adjacent towns
    minPayoutDistance = 100
    # Fare curve exponent: 1.0 = linear (distance ÷ metersPerEmerald).
    # Other values: (distance ÷ payoutReferenceBlocks)^exponent × payoutEmeraldsPerTouristAtReference
    payoutCurveExponent = 1.0
    payoutReferenceBlocks = 1000
    payoutEmeraldsPerTouristAtReference = 10.0
    # Cumulative visitor-blocks to reach town notoriety tiers 2–5
    # (Wayside, then Halt, Station, Destination, Landmark).
    notorietyDistances = [2000, 10000, 40000, 120000]
    # Currency item for trading (format: modid:item)
    currencyItem = "minecraft:emerald"

[milestones]
    # Enable distance milestone rewards
    enabled = true

    # Milestone rewards configuration
    # Each [[milestones.rewards]] entry defines a distance threshold and item rewards
    # Format: distance = meters, items = ["modid:item:count", ...]
    [[milestones.rewards]]
        distance = 1000
        items = ["minecraft:apple:1"]

    [[milestones.rewards]]
        distance = 5000
        items = ["minecraft:bread:1"]

[contracts]
    enabled = false
    # Enable contract system (auction, bidding, delivery)
    # Auction duration in minutes
    auctionDurationMinutes = 1.0
    # Courier acceptance window in minutes
    courierAcceptanceMinutes = 2.0
    # Courier delivery time per meter (minutes)
    courierDeliveryMinutesPerMeter = 0.05
    # Snail mail delivery time per meter (minutes)
    snailMailDeliveryMinutesPerMeter = 0.1

[production]
    # Enable automatic production system
    enabled = false
    # Ticks between production cycles
    tickInterval = 100
    # Daily tick interval for consumption
    dailyTickInterval = 24000
    # Minimum stock percentage before buying
    minStockPercent = 60
    # Excess stock percentage for selling
    excessStockPercent = 80

[trading]
    # Enable trading system
    enabled = false
    # Ticks between trading cycles
    tickInterval = 60
    # Restock rate multiplier
    restockRate = 0.5
    # Default max stock for items
    defaultMaxStock = 1000.0

[display]
    # Timezone for time display
    # Options: "UTC" (default), "SYSTEM" (use OS default), or timezone ID like "America/New_York"
    timezone = "UTC"

[player]
    # Enable player tracking system
    playerTracking = true
    # Show town boundary entry/exit messages
    townBoundaryMessages = true

[research]
enabled = false
# Enable research/upgrade system

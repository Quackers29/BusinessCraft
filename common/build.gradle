plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

archivesBaseName = 'businesscraft-common'

minecraft {
    mappings channel: 'parchment', version: '2023.06.26-1.20.1'
}

dependencies {
    minecraft('net.minecraftforge:forge:1.20.1-47.1.0') {
        transitive = false
    }

    // SLF4J for logging (used by debug and configuration classes)
    api 'org.slf4j:slf4j-api:1.7.36'

    // JetBrains annotations for @NotNull/@Nullable
    api 'org.jetbrains:annotations:23.0.0'

    // Jade API for optional tooltip providers (compile-time only; not bundled)
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_forge_curse_file}")

    // Unit testing (Test + Docs Loop — see tasks/test_doc_loop.md)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('productionSim', Test) {
    group = 'verification'
    description = 'Headless production simulation. -Dbusinesscraft.productionSim.ticks and .dir override the length and output.'
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.quackers29.businesscraft.debug.production.ProductionSimulationTest'
    }
    systemProperty 'businesscraft.productionSim.ticks',
            System.getProperty('businesscraft.productionSim.ticks', '6000')
    systemProperty 'businesscraft.productionSim.dir',
            System.getProperty('businesscraft.productionSim.dir',
                    layout.buildDirectory.dir('production-sim').get().asFile.absolutePath)
    systemProperty 'businesscraft.productionSim.seed',
            System.getProperty('businesscraft.productionSim.seed', '29')
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

// Configure jar to exclude Forge runtime classes
jar {
    manifest {
        attributes([
            "Specification-Title": "businesscraft",
            "Specification-Vendor": "Quackers29",
            "Specification-Version": "1",
            "Implementation-Title": "BusinessCraft",
            "Implementation-Version": project.version,
            "Implementation-Vendor": "Quackers29",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'net/minecraftforge/**'
    exclude 'META-INF/mods.toml'
}